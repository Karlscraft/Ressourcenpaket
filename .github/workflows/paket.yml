# ==============================================================================
#  Karlscraft - Ressourcenpaket veroeffentlichen
#
#  Ablage:  .github/workflows/paket.yml   (im Repo Karlscraft/Ressourcenpaket)
#
#  Versionsschema nach Mojangs Snapshot-Vorbild:  26w37a
#    26  = ISO-Wochenjahr, zweistellig
#    w   = week
#    37  = ISO-Kalenderwoche
#    a   = fortlaufender Buchstabe, falls mehrere Veroeffentlichungen pro Woche
#
#  Es werden ZWEI identische Dateien an das Release gehaengt:
#    26w37a.zip      - die versionierte Fassung zum Archivieren und Verlinken
#    Karlscraft.zip  - gleicher Inhalt unter festem Namen, damit die Adresse
#                      .../releases/latest/download/Karlscraft.zip stabil bleibt.
#                      Das Startskript des Servers holt sich diese Datei.
# ==============================================================================

name: Ressourcenpaket veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Zwei gleichzeitige Laeufe wuerden denselben Buchstaben vergeben
concurrency:
  group: ressourcenpaket
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # bringt die vorhandenen Tags mit

      - name: Struktur pruefen
        run: |
          if [ ! -f pack.mcmeta ]; then
            echo "::error::pack.mcmeta fehlt in der Wurzel des Repositories."
            echo "Die Datei muss direkt im Hauptverzeichnis liegen, nicht in einem Unterordner."
            exit 1
          fi
          if [ ! -d assets ]; then
            echo "::error::Der Ordner assets/ fehlt in der Wurzel des Repositories."
            exit 1
          fi
          echo "Struktur in Ordnung."

      - name: Version bestimmen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # %G und %V gehoeren zwingend zusammen: %G ist das ISO-WOCHENjahr,
          # nicht das Kalenderjahr. Der 30.12.2025 liegt in ISO-Woche 1 von
          # 2026 und heisst damit korrekt 26w01x. Mit %Y statt %G kaeme hier
          # faelschlich 25w01x heraus.
          ISO_JAHR=$(date -u +%G)
          WOCHE=$(date -u +%V)
          BASIS="${ISO_JAHR: -2}w${WOCHE}"
          echo "Basis dieser Woche: $BASIS  (UTC: $(date -u))"

          # Bereits vergebene Kennungen sammeln - sowohl aus Releases als auch
          # aus Tags. Ein geloeschtes Release kann seinen Tag hinterlassen, und
          # der wuerde beim Anlegen kollidieren.
          VERGEBEN=$( {
            gh release list --limit 1000 --json tagName --jq '.[].tagName' 2>/dev/null || true
            git tag -l "${BASIS}*" || true
          } | sort -u )

          BUCHSTABEN=({a..z})

          # 0->a, 25->z, 26->aa, 27->ab ... reicht fuer 702 Stueck pro Woche
          suffix_fuer() {
            local n=$1
            if [ "$n" -lt 26 ]; then
              echo "${BUCHSTABEN[$n]}"
            else
              echo "${BUCHSTABEN[$(( n / 26 - 1 ))]}${BUCHSTABEN[$(( n % 26 ))]}"
            fi
          }

          VERSION=""
          for i in $(seq 0 701); do
            KANDIDAT="${BASIS}$(suffix_fuer "$i")"
            if ! printf '%s\n' "$VERGEBEN" | grep -qx "$KANDIDAT"; then
              VERSION="$KANDIDAT"
              break
            fi
          done

          if [ -z "$VERSION" ]; then
            echo "::error::Alle Kennungen fuer $BASIS sind vergeben."
            exit 1
          fi

          echo "Neue Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Version in pack.mcmeta eintragen
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # Nur wenn die Beschreibung ein einfacher Text ist - bei einer
          # JSON-Textkomponente wuerde das Anhaengen fehlschlagen.
          if jq -e '.pack.description | type == "string"' pack.mcmeta > /dev/null; then
            jq --arg v "$VERSION" '.pack.description = (.pack.description + " " + $v)' \
               pack.mcmeta > /tmp/pack.mcmeta
            mv /tmp/pack.mcmeta pack.mcmeta
            echo "Beschreibung im Paket:"
            jq -r '.pack.description' pack.mcmeta
          else
            echo "Beschreibung ist kein einfacher Text - bleibt unveraendert."
          fi

      - name: ZIP erzeugen
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # Der Punkt packt den INHALT des Verzeichnisses ein, ohne
          # umschliessenden Ordner - genau das braucht Minecraft.
          zip -r -9 "/tmp/${VERSION}.zip" . \
            -x '.git/*' '.github/*' '*.md' 'LICENSE' '.gitattributes' '.gitignore'

          # Zweite, namensstabile Ausfertigung fuer das Startskript
          cp "/tmp/${VERSION}.zip" /tmp/Karlscraft.zip

          echo "--- Wurzel des Archivs ---"
          unzip -l "/tmp/${VERSION}.zip" | head -20

      - name: Groesse und Pruefsumme ausgeben
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          GROESSE=$(stat -c%s "/tmp/${VERSION}.zip")
          SHA1=$(sha1sum "/tmp/${VERSION}.zip" | cut -d' ' -f1)
          MB=$(( GROESSE / 1048576 ))

          {
            echo "### Ressourcenpaket ${VERSION}"
            echo ""
            echo "| Feld | Wert |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Groesse | ${MB} MB (${GROESSE} Byte) |"
            echo "| SHA-1 | \`${SHA1}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GROESSE" -gt 52428800 ]; then
            echo "::warning::Ueber 50 MB - aeltere Minecraft-Clients lehnen zu grosse Pakete ab."
          fi

      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # gh ist auf den Runnern vorinstalliert. Damit braucht dieser
          # Workflow keine fremde Action, die Schreibrechte auf das Repo bekommt.
          gh release create "$VERSION" \
            "/tmp/${VERSION}.zip" \
            /tmp/Karlscraft.zip \
            --title "$VERSION" \
            --notes "Automatisch erzeugt aus Commit ${{ github.sha }}" \
            --latest
