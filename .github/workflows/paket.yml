name: Ressourcenpaket veroeffentlichen
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP ohne umschliessenden Ordner erzeugen
        run: zip -r /tmp/Karlscraft.zip . -x '.git/*' '.github/*' '*.md'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aktuell
          files: /tmp/Karlscraft.zip
